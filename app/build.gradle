plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

// Read backend base URLs from local.properties (not committed to VCS).
// Fall back to placeholders so the public repo builds without secrets.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def backendDevUrl = localProps.getProperty("BACKEND_DEV_URL", "http://YOUR_DEV_HOST:8080")
def backendTestUrl = localProps.getProperty("BACKEND_TEST_URL", "http://YOUR_TEST_HOST:port")
def backendProdUrl = localProps.getProperty("BACKEND_PROD_URL", "http://YOUR_PROD_HOST:8080")
// LOCAL：真机 USB 调试。手机上的 localhost:<port> 经 `adb reverse` 转发到 PC 本地后端。
// 与 DEV/TEST/PROD 同一套机制——统一从 local.properties 注入，不在中间件里硬编码。
// 默认值与 adb reverse 的惯用端口一致（adb reverse tcp:8080 tcp:8080）。
def backendLocalUrl = localProps.getProperty("BACKEND_LOCAL_URL", "http://localhost:8080")

// 默认环境（DEV | TEST | PROD | LOCAL），从 local.properties 注入。
// 与 base URL 同样属于"本地配置"，不该硬编码在中间件代码里。
def defaultEnvironment = localProps.getProperty("DEFAULT_ENVIRONMENT", "TEST")

// Hosts for the generated network_security_config.xml (cleartext HTTP allowlist).
// LOCAL 的 host（通常是 localhost / 127.0.0.1）也一并放行。
def backendHosts = ([backendDevUrl, backendTestUrl, backendProdUrl, backendLocalUrl].collect { u ->
    try { new URI(u).host } catch (Exception ignored) { null }
}.findAll { it != null } + ['localhost', '127.0.0.1']).unique()
def networkSecurityDir = file("$buildDir/generated/res")

android {
    namespace 'com.deepsleep.memory'
    compileSdk 34

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.deepsleep.memory"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "DEV_BASE_URL", "\"${backendDevUrl}\""
        buildConfigField "String", "TEST_BASE_URL", "\"${backendTestUrl}\""
        buildConfigField "String", "PROD_BASE_URL", "\"${backendProdUrl}\""
        // LOCAL（真机 USB 调试）：与上面三个同等对待，统一由 local.properties 注入
        buildConfigField "String", "LOCAL_BASE_URL", "\"${backendLocalUrl}\""
        // 默认环境名，供 ApiConstants 初始化 currentEnv（避免硬编码在中间件里）
        buildConfigField "String", "DEFAULT_ENVIRONMENT", "\"${defaultEnvironment}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 签名配置。
    // 本仓库原本没有 signingConfigs —— release 构建产不出可安装的签名包。
    // 这里默认复用**调试密钥**（AGP 自动生成在 $ANDROID_SDK_HOME/.android/debug.keystore），
    // 使 `assembleDebug` 与 `assembleRelease` 共用一个签名，装到真机可互相覆盖升级。
    //
    // ⚠️ 调试密钥仅供内部/毕设演示使用，**不可用于正式发布**（会被当成 debug 签名，
    //    且换密钥后无法覆盖升级）。要正式发布时，在 local.properties 里提供：
    //      RELEASE_STORE_FILE / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD
    //    本文件会自动优先使用它们，不影响明文密钥入库。
    def releaseStoreFile = localProps.getProperty("RELEASE_STORE_FILE")
    def hasReleaseKey = releaseStoreFile != null && file(releaseStoreFile).exists()
    def debugStoreFile = new File(
            (System.getenv("ANDROID_SDK_HOME") ?: System.getenv("ANDROID_SDK_ROOT") ?: "${System.getProperty('user.home')}") +
                    "/.android/debug.keystore")

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStoreFile)
                storePassword localProps.getProperty("RELEASE_STORE_PASSWORD", "")
                keyAlias localProps.getProperty("RELEASE_KEY_ALIAS", "")
                keyPassword localProps.getProperty("RELEASE_KEY_PASSWORD", "")
            }
        }
        if (debugStoreFile.exists()) {
            debugLike {
                storeFile debugStoreFile
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            } else if (debugStoreFile.exists()) {
                // 没有正式密钥时退回调试密钥，保证 release 包可安装（见上方说明）
                signingConfig signingConfigs.debugLike
            }
        }
    }

    // 该项目的 release 仅用于毕设真机验收，lint 会额外拉取 lint-gradle 依赖且无实际收益，
    // 因此关闭（开启时会因离线环境缺依赖而构建失败）。
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Room (SQLite ORM)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation 'io.noties.markwon:core:4.6.2'
    // 裁剪组件源码已内置（见 com.canhub.cropper 包，含 wrap/缩放行为定制），仅保留其运行时依赖
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'com.afollestad.material-dialogs:input:3.3.0'
    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.github.arcadefire:nice-spinner:1.3.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Modern API layer (MemoryApiClient 唯一入口；旧 HttpManager/GetDataByThread 已删除).
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
}

// Generate network_security_config.xml from local.properties hosts so the
// public repo ships no real backend domains. Cleartext HTTP is only allowed
// for the configured backend hosts.
abstract class GenerateNetworkSecurityConfigTask extends DefaultTask {
    @Input
    abstract Property<String> getBackendHostsCsv()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def hosts = backendHostsCsv.get().split(',').findAll { it }
        def domains = hosts.collect { "<domain includeSubdomains=\"true\">${it}</domain>" }.join("\n        ")
        def xml = """<?xml version="1.0" encoding="UTF-8" ?>
<network-security-config>
    <domain-config cleartextTrafficPermitted="true">
        ${domains}
    </domain-config>
</network-security-config>
"""
        def xmlDir = new File(outputDir.get().asFile, "xml")
        xmlDir.mkdirs()
        new File(xmlDir, "network_security_config.xml").text = xml
    }
}

def generateNetworkSecurityConfig = tasks.register('generateNetworkSecurityConfig', GenerateNetworkSecurityConfigTask) {
    backendHostsCsv.set(backendHosts.join(','))
    outputDir.set(networkSecurityDir)
}

// Register the generated res folder per-variant (AGP wires task dependencies).
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.res?.addGeneratedSourceDirectory(generateNetworkSecurityConfig) { task ->
            task.outputDir
        }
    }
}
